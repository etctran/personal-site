<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ethan Tran — Software Engineer</title>
    <meta name="description" content="Ethan Tran, computer science student at UNC Chapel Hill: projects, experience and how to get in touch." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="canonical" href="https://ethanctran.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ethanctran.dev/" />
    <meta property="og:title" content="Ethan Tran — Software Engineer" />
    <meta property="og:description" content="Computer science student at UNC Chapel Hill. AI, backend and infrastructure. Most recently at IBM." />
    <meta property="og:image" content="https://ethanctran.dev/og.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="420" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Show the intro only on a fresh visit to the top of the page, with motion allowed.
      try {
        if (
          !location.hash &&
          !sessionStorage.getItem('entered') &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('intro-on')
          history.scrollRestoration = 'manual'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="progress" aria-hidden="true"></div>

    <div class="intro" id="intro">
      <button class="enter" id="enter" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M14.5 3.5v5a2 2 0 0 1-2 2h-8M7.5 7.5l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="enter__key">Press Enter</span>
        <span class="enter__touch">Tap to enter</span>
      </button>
    </div>

    <div class="page">
      <nav id="nav" class="nav" aria-label="Primary">
        <div class="wrap nav__in">
          <div class="nav__links">
            <a class="link" href="#about">About</a>
            <a class="link" href="#experience">Experience</a>
            <a class="link" href="#projects">Projects</a>
            <a class="link" href="#contact">Contact</a>
          </div>
        </div>
      </nav>

      <header class="hero wrap" id="top" data-field="ring">
        <h1 class="name" id="name"><span class="name__line">Ethan</span> <span class="name__line">Tran</span></h1>
        <p class="hero__lead fade-up" id="lead" style="--i: 0"></p>
        <div class="hero__actions">
          <a class="btn btn--solid fade-up" style="--i: 1" href="#projects">See projects</a>
          <a class="btn fade-up" style="--i: 2" href="#contact">Get in touch</a>
        </div>
      </header>

      <main>
        <section id="about" class="panel" data-field="wave" aria-labelledby="about-h">
          <div class="wrap">
            <h2 id="about-h">About</h2>
            <div class="about">
              <div class="section-content"></div>
              <div class="about__side">
                <div id="portrait"></div>
                <dl class="facts" id="facts"></dl>
              </div>
            </div>
          </div>
        </section>

        <div class="gap" aria-hidden="true"></div>

        <section id="experience" class="panel" data-field="stream" aria-labelledby="experience-h">
          <div class="wrap">
            <h2 id="experience-h">Experience</h2>
            <div class="exps section-content"></div>
          </div>
        </section>

        <div class="gap" aria-hidden="true"></div>

        <section id="projects" class="panel" data-field="grid" aria-labelledby="projects-h">
          <div class="wrap">
            <h2 id="projects-h">Projects</h2>
            <div class="rows section-content"></div>
          </div>
        </section>

        <section id="contact" class="end" data-field="core" aria-labelledby="contact-h">
          <div class="wrap">
            <h2 id="contact-h">Get in touch</h2>
            <div class="section-content"></div>
          </div>
        </section>
      </main>

      <footer class="wrap"><span>© 2026 Ethan Tran</span><span>ethanctran.dev</span></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
